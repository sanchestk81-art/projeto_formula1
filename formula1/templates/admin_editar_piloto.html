{% extends "base.html" %}

{% block title %}Editar Piloto • {{ piloto.nome }} • Painel Setor F1{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="margin-bottom: 25px;">
        &larr; Voltar ao Painel Admin
    </a>

    <div class="card" style="padding: 35px; border-top: 5px solid var(--f1-red);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h1 style="color: #fff; font-size: 1.6rem; display: flex; align-items: center; gap: 8px; margin: 0;">
                ✏️ Editar Piloto: {{ piloto.nome }}
            </h1>
            {% if piloto.foto_url %}
            <div style="width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 2px solid var(--f1-red);">
                <img src="{{ piloto.foto_url }}" alt="{{ piloto.nome }}" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            {% endif %}
        </div>

        <form action="{{ url_for('admin_editar_piloto', id=piloto.id) }}" method="POST" enctype="multipart/form-data">
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 18px;">
                <div class="form-group">
                    <label class="form-label">Nome Completo do Piloto *</label>
                    <input type="text" name="nome" class="form-control" value="{{ piloto.nome }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Número do Carro</label>
                    <input type="number" name="numero" class="form-control" value="{{ piloto.numero or '' }}">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;">
                <div class="form-group">
                    <label class="form-label">Nacionalidade *</label>
                    <input type="text" name="nacionalidade" class="form-control" value="{{ piloto.nacionalidade }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Código do País (Bandeira) *</label>
                    <input type="text" name="pais_codigo" class="form-control" value="{{ piloto.pais_codigo }}" placeholder="Ex: br, nl, mc, gb" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Equipe Relacionada</label>
                    <select name="equipe_id" class="form-control">
                        <option value="">Sem Equipe / Agente Livre</option>
                        {% for eq in equipes %}
                        <option value="{{ eq.id }}" {% if piloto.equipe_id == eq.id %}selected{% endif %}>{{ eq.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Papel na Equipe *</label>
                    <select name="papel_equipe" class="form-control">
                        <option value="titular" {% if piloto.papel_equipe == 'titular' %}selected{% endif %}>🏎️ Piloto Titular (Grid Oficial)</option>
                        <option value="reserva" {% if piloto.papel_equipe == 'reserva' %}selected{% endif %}>🛡️ Piloto Reserva / Testes</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px;">
                <div class="form-group">
                    <label class="form-label">Pontos na Temporada</label>
                    <input type="number" name="pontos_temporada" class="form-control" value="{{ piloto.pontos_temporada or 0 }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Chance de Título (%)</label>
                    <input type="number" step="0.1" name="chance_titulo" class="form-control" value="{{ piloto.chance_titulo or 0.0 }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Títulos Mundiais</label>
                    <input type="number" name="titulos_mundiais" class="form-control" value="{{ piloto.titulos_mundiais or 0 }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Vitórias na Carreira</label>
                    <input type="number" name="vitorias" class="form-control" value="{{ piloto.vitorias or 0 }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Pódios na Carreira</label>
                    <input type="number" name="podios" class="form-control" value="{{ piloto.podios or 0 }}">
                </div>
            </div>

            <!-- FOTO DO PILOTO (UPLOAD OU URL) -->
            <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--f1-card-border); border-radius: 8px; padding: 18px; margin-bottom: 20px;">
                <h4 style="color: var(--f1-gold); font-size: 0.95rem; margin-bottom: 12px;">📸 Atualizar Foto do Piloto</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Fazer Upload de Nova Foto (Arquivo)</label>
                        <input type="file" name="foto_arquivo" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Ou URL da Imagem</label>
                        <input type="text" name="foto_url" class="form-control" value="{{ piloto.foto_url or '' }}" placeholder="https://exemplo.com/piloto.jpg">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Como Entrou na Fórmula 1 *</label>
                <textarea name="como_entrou_f1" class="form-control" rows="3" required>{{ piloto.como_entrou_f1 or '' }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Trajetória e Conquistas na F1 *</label>
                <textarea name="trajetoria_f1" class="form-control" rows="4" required>{{ piloto.trajetoria_f1 or '' }}</textarea>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="color: #fff; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" name="ativo" value="true" {% if piloto.ativo %}checked{% endif %} style="width: 18px; height: 18px;">
                    Piloto Ativo na Temporada Atual (Aparece no Grid e no DataTable da Home)
                </label>
            </div>

            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn btn-primary" style="padding: 12px 25px;">
                    💾 Salvar Alterações do Piloto
                </button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
